<!DOCTYPE html>
<html>
<head>
    <title>Job Board</title>
</head>
<body>

<h2>Job Board</h2>

<a href="/add">Add Job</a>

<table border="1" cellpadding="8">
<tr>
    <th>ID</th>
    <th>Job Title</th>
    <th>Company</th>
    <th>Action</th>
</tr>

{% for job in jobs %}
<tr>
    <td>{{ job.id }}</td>
    <td>{{ job.title }}</td>
    <td>{{ job.company }}</td>
    <td>
        <a href="/delete/{{ job.id }}">Delete</a>
    </td>
</tr>
{% endfor %}

</table>

</body>
</html>
